name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything here runs with no secrets, so it works on a fork and on a fresh
  # clone. It builds with placeholder credentials on purpose: Vite inlines
  # import.meta.env at build time, and without any values the app compiles down
  # to just the setup screen — which verify-build would then correctly reject.
  build:
    name: Build and check migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Migrations are well-named and committed
        run: node scripts/check-migrations.mjs

      - name: Build, and assert every screen shipped
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  # Only meaningful once the three secrets exist. It reports rather than fails
  # the run, because a missing secret is not a broken pull request — and
  # because a fork's pull request cannot see secrets at all.
  drift:
    name: Schema drift against the linked project
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Are the credentials present?
        id: creds
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$PROJECT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the drift check — add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID to enable it."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.creds.outputs.ready == 'true'
        with:
          version: latest

      - name: Compare migrations with the linked project
        if: steps.creds.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          node scripts/check-drift.mjs
