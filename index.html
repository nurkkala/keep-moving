<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Keep Moving</title>
    <script>
      /* Runs before first paint, so the page never flashes the wrong theme.
         localStorage is the source of truth here — a database round trip can't
         beat the first frame. The signed-in preference reconciles into it once
         a session exists. Kept in sync with src/lib/theme.js. */
      (function () {
        try {
          var stored = localStorage.getItem("km-theme");
          if (stored !== "light" && stored !== "dark") stored = "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#020617" : "#f8fafc");
        } catch (e) {
          /* Private mode can throw on localStorage. Falling through leaves the
             light default, which is readable either way. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
